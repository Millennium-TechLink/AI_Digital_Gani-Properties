<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/images/Logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Matches the header's opaque state (#FFFFFF in Navbar.tsx), which is
         what's actually on screen behind the safe-area/notch strip for
         every page except the homepage's first screenful before scrolling.
         A mismatched theme-color there reads as a colored frame around the
         page - most visible once the mobile menu opens and forces a stark
         white panel against it. -->
    <meta name="theme-color" content="#FFFFFF" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loaded as media="print" then swapped to "all" on load instead of a
         plain rel="stylesheet": a synchronous stylesheet link blocks CSSOM
         construction (and therefore first paint) until the round trip to
         fonts.googleapis.com finishes - Lighthouse's mobile run measured
         839ms of blocking time on this one request alone, on top of the
         extra RTT to fonts.gstatic.com for the actual .woff2 files behind
         it. media="print" makes the browser fetch it without it ever being
         "the stylesheet that applies to this render", so first paint isn't
         waiting on it; the onload swap then applies it the moment it's
         actually ready. noscript covers the no-JS case, where onload never
         fires. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@400;500;600&family=Poppins:wght@400;500;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@400;500;600&family=Poppins:wght@400;500;600&display=swap" />
    </noscript>
    <!-- Home is the main-bundle, most-visited entry point (see App.tsx), and
         this is its hero's first slide / LCP element (HeroFullScreen.tsx,
         now self-hosted - see that file's comment). Without this, nothing
         about the image exists in the document until React mounts and
         renders it, so the browser's preload scanner can't start fetching
         it until the JS bundle has downloaded and run - putting the preload
         tag here instead lets that fetch start in parallel with, rather
         than after, the JS bundle. -->
    <link rel="preload" as="image" href="/images/hero-premium-plots.jpg" fetchpriority="high" />
    <title>Gani Properties - Premium Property Providers in Bangalore</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
