<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/images/Logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F3A3D" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@400;500;600&family=Poppins:wght@400;500;600&display=swap" />
    <!-- Home is the main-bundle, most-visited entry point (see App.tsx), and
         this is its hero's first slide / LCP element (HeroFullScreen.tsx).
         Without this, nothing about the image exists in the document until
         React mounts and renders it, so the browser's preload scanner can't
         start fetching it until the JS bundle has downloaded and run -
         putting the preload tag here instead lets that fetch start in
         parallel with, rather than after, the JS bundle. -->
    <link rel="preload" as="image" href="/images/hero-residential.png" fetchpriority="high" />
    <title>Gani Properties - Premium Property Providers in Bangalore</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
